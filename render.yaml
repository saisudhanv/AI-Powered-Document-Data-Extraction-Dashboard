services:
  - type: web
    name: docextract-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: docextract-storage
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /data/documents.db
      - key: UPLOAD_DIR
        value: /data/uploads
